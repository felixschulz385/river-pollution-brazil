# Declares analysis-ready output datasets built by `src.data.assembly`.
#
# Each dataset lists the final table's `index` columns and, per source, the
# join keys used to attach that source plus the variables pulled from it.
# `type: land_cover_bucketed` marks sources in the long
# `[*join_keys, bucket, land_cover_class, n, cnt, share]` schema produced by
# the land-cover sensor/ADM2 assembly variants; these are collapsed into
# distance-kernel-weighted composition shares (`lc_*`/`lc_nat`) and
# additive-log-ratio variables (`alr_*`) via
# `src.data.sources.land_cover.composition.compute_kernel_weighted_composition`
# before joining. `id_map` renames a source's raw id column (e.g. the
# 7-digit `adm2_id`) to the canonical join key used elsewhere (`mun_id`).
# `type: long_pivot` marks sources long over a category column (e.g.
# climate's `climate_variable` x `distance_bucket`); `filter` narrows to one
# row per (join_keys, category value) and `pivot_column`/`value_columns`
# pivot the category's values into `{category_value}_{value_column}` columns
# (or `column_template`, formatted with `pivot_value`/`value_column`).
# `rename` renames raw columns (including join keys) without the id
# derivation `id_map` applies.
# `scope: local` (bucketed ADM2 sources only) averages the rings of the trenches
# touching the ADM2 instead of kernel-weighting the 0-500 km upstream rings, and
# prefixes the outputs `local_`. `max_km` (upstream scope only) keeps the rings
# starting below it, e.g. 50 -> 0-25 and 25-50 km.
# `type: mining_bucketed` reads the same long bucket schema from the MapBiomas
# Collection 11 mining-substances aggregate and yields `mining_*` group shares
# (`src.data.sources.land_cover.mining.compute_mining_composition`).
# `fill: {value, years}` sets the source's variables to `value` where the merge
# left them missing, within `years` (inclusive) if given: for count tables that
# list only municipality-years with a non-zero count.
# `type: grouped_sum` marks sources long over some other non-join-key
# dimension (e.g. population's `sex`/`age_group`); `variables` are summed
# across that dimension, collapsing to one row per `join_keys` before the
# merge -- otherwise a many-to-one merge against a source's raw stratified
# rows fails outright.
# Every variable is coerced to float dtype unless listed under a source's
# `categorical_variables` (e.g. biome_adm2's dominant-biome label); this
# catches upstream columns that round-tripped through parquet as strings.

datasets:
  - id: sensor_panel
    mode: sensor
    index: [station_code, datetime]
    output_path: data/assembly/sensor_panel.parquet
    sources:
      - name: water_quality_streamflow
        path: data/sensor_data/processed/aggregate/sensor_data.parquet
        join_keys: [station_code, datetime]
        variables:
          - rained
          - depth
          - air_temperature
          - sample_temperature
          - ph
          - color
          - turbidity
          - electrical_conductivity
          - total_hardness
          - hardness
          - chemical_oxygen_demand
          - biochemical_oxygen_demand
          - dissolved_oxygen
          - total_solids
          - fixed_solids
          - volatile_solids
          - total_suspended_solids
          - fixed_suspended_solids
          - volatile_suspended_solids
          - total_dissolved_solids
          - fixed_dissolved_solids
          - volatile_dissolved_solids
          - settleable_solids
          - detergents
          - carbonate_alkalinity
          - bicarbonate_alkalinity
          - hydroxide_alkalinity
          - chlorides
          - sulfates
          - sulfides
          - fluorides
          - total_phosphate
          - cyanides
          - total_nitrogen
          - unionized_ammonia
          - ammoniacal_nitrogen
          - nitrates
          - nitrites
          - organochlorine_compounds
          - organophosphorus_compounds
          - aluminum
          - arsenic
          - cadmium
          - lead
          - copper
          - trivalent_chromium
          - hexavalent_chromium
          - manganese
          - mercury
          - nickel
          - zinc
          - phenols_index
          - total_coliforms
          - fecal_coliforms
          - residual_chlorine
          - barium
          - beryllium
          - boron
          - cobalt
          - tin
          - lithium
          - silver
          - selenium
          - total_uranium
          - vanadium
          - benzene
          - benzo_a_pyrene
          - pentachlorophenol
          - tetrachloroethene
          - trichloroethene
          - carbon_tetrachloride
          - aldrin
          - chlordane
          - ddt
          - dieldrin
          - endrin
          - endosulfan
          - heptachlor_epoxide
          - heptachlor
          - lindane
          - methoxychlor
          - dodecachlorononachlor
          - polychlorinated_biphenyls
          - toxaphene
          - demeton
          - guthion
          - malathion
          - parathion
          - carbaryl
          - 2_4_dichlorophenoxyacetic_acid
          - bhc
          - ethion
          - disulfoton
          - phosdrin
          - ddepp
          - ethyl_azinphos
          - diazinon
          - fecal_streptococci
          - salmonella
          - coliphages
          - heterotrophic_bacteria
          - protozoa
          - fungi
          - algae
          - plate_bacteria_count
          - chlorophyll
          - oils_and_grease
          - total_alkalinity
          - total_organic_carbon
          - hydrocarbons
          - total_orthophosphate
          - total_chromium
          - methyl_parathion
          - organic_nitrogen
          - total_sodium
          - total_magnesium
          - dissolved_silica
          - total_potassium
          - total_calcium
          - total_iron
          - liquid_discharge
          - total_phosphorus
          - total_bismuth
          - acidity
          - albuminoid_nitrogen
          - transparency
          - enteropathogenic_bacteria
          - total_zooplankton
          - ammonia
          - thermotolerant_coliforms
          - escherichia
          - specific_conductivity
          - dissolved_iron
          - quantitative_phytoplankton
          - depth_parameter
          - trench_id
          - streamflow_discharge_day
          - streamflow_discharge_mean_7d
          - streamflow_discharge_mean_31d
          - streamflow_match_count
          - streamflow_nonnull_day_count
          - streamflow_total_weight
          - streamflow_nearest_distance_m
      - name: river_system
        path: data/river_network/processed/river_network_trenches.parquet
        join_keys: [trench_id]
        variables:
          - system_id
        # system_id is a disconnected-river-system identifier (connected
        # component of the flow graph, see src.data.sources.river_network.core), not
        # a measurement -- exclude it from numeric-dtype enforcement so it
        # stays a clean integer/categorical grouping key (e.g. for
        # basin-level clustering in regressions).
        categorical_variables: [system_id]
      - name: otto_basins
        path: data/river_network/processed/river_network_otto_basins.parquet
        join_keys: [trench_id]
        variables:
          - otto_basin_l2
          - otto_basin_l3
          - otto_basin_l4
          - otto_basin_l5
        # Nested Otto Pfafstetter sub-basin codes of the station's trench (see
        # src.data.sources.river_network.otto_basins) -- the clustering unit for
        # inference, since system_id is dominated by one huge connected system.
        # String codes, not measurements: exclude from numeric-dtype enforcement.
        categorical_variables: [otto_basin_l2, otto_basin_l3, otto_basin_l4, otto_basin_l5]
      - name: land_cover_sensor_upstream
        path: data/land_cover/processed/aggregate/land_cover_sensor_upstream.parquet
        type: land_cover_bucketed
        join_keys: [station_code, year]
        variables:
          - lc_forest
          - lc_nonforest_nat
          - lc_pasture
          - lc_agriculture
          - lc_farming_unclassified
          - lc_urban
          - lc_mining
          - lc_other
          - lc_water
          - lc_nat
          - alr_pasture
          - alr_agriculture
          - alr_farming_unclassified
          - alr_urban
          - alr_mining
          - alr_other
      - name: climate_sensor_upstream
        path: data/climate/processed/aggregate/climate_sensor_upstream.parquet
        type: long_pivot
        join_keys: [station_code, date]
        # Nearest 25km upstream ring (bucket lower bound 0) -- the local
        # catchment's climate, matching how land-cover buckets are anchored.
        filter: {distance_bucket: 0}
        pivot_column: climate_variable
        value_columns: [mean_day, mean_7d, mean_30d, mean_90d, mean_180d, mean_365d]
        # Raw ERA5-Land variable codes referenced by src/data/sources/climate/schema.py's
        # ANNUAL_* aggregation-rule sets; confirm/extend against the actual
        # `climate_sensor_upstream.parquet` `climate_variable` values at
        # assembly time before relying on this exact list.
        variables:
          - 2t_mean_day
          - 2t_mean_7d
          - 2t_mean_30d
          - 2t_mean_90d
          - 2t_mean_180d
          - 2t_mean_365d
          - 2d_mean_day
          - 2d_mean_7d
          - 2d_mean_30d
          - 2d_mean_90d
          - 2d_mean_180d
          - 2d_mean_365d
          - tp_mean_day
          - tp_mean_7d
          - tp_mean_30d
          - tp_mean_90d
          - tp_mean_180d
          - tp_mean_365d
          - sro_mean_day
          - sro_mean_7d
          - sro_mean_30d
          - sro_mean_90d
          - sro_mean_180d
          - sro_mean_365d
          - ssro_mean_day
          - ssro_mean_7d
          - ssro_mean_30d
          - ssro_mean_90d
          - ssro_mean_180d
          - ssro_mean_365d
          - pev_mean_day
          - pev_mean_7d
          - pev_mean_30d
          - pev_mean_90d
          - pev_mean_180d
          - pev_mean_365d
          - swvl1_mean_day
          - swvl1_mean_7d
          - swvl1_mean_30d
          - swvl1_mean_90d
          - swvl1_mean_180d
          - swvl1_mean_365d
          - swvl2_mean_day
          - swvl2_mean_7d
          - swvl2_mean_30d
          - swvl2_mean_90d
          - swvl2_mean_180d
          - swvl2_mean_365d
          - 2t_daily_min_mean_day
          - 2t_daily_min_mean_7d
          - 2t_daily_min_mean_30d
          - 2t_daily_min_mean_90d
          - 2t_daily_min_mean_180d
          - 2t_daily_min_mean_365d
          - 2t_daily_max_mean_day
          - 2t_daily_max_mean_7d
          - 2t_daily_max_mean_30d
          - 2t_daily_max_mean_90d
          - 2t_daily_max_mean_180d
          - 2t_daily_max_mean_365d
      - name: biome_sensor
        path: data/biomes/processed/biomes_sensor.parquet
        join_keys: [station_code]
        variables:
          - biome
        # A station's biome is a fixed label from its point location, not a
        # measurement -- exclude it from numeric-dtype enforcement.
        categorical_variables: [biome]

  - id: adm2_panel
    mode: adm2
    index: [mun_id, year]
    output_path: data/assembly/adm2_panel.parquet
    sources:
      # Both land-cover and climate ADM2 sources are long over discrete 25km
      # upstream distance buckets (produced by aggregate_along_rivers /
      # _assemble_adm2_upstream_duckdb respectively); `kernel` collapses them
      # into per-entity values the same way -- explicit here so both weight
      # distance identically and match the sensor side's inv-sqrt kernel
      # (shared.DEFAULT_ADM2_DISTANCE_KERNEL).
      # Local land cover: the rings of the trenches that touch the municipality
      # (`bucket_intersects_adm2`), equally weighted. Every matched municipality
      # has them, so this first source is the panel's spine -- headwater
      # municipalities with no upstream rings stay in, with NaN upstream exposure.
      - name: land_cover_adm2_local
        path: data/land_cover/processed/aggregate/land_cover_adm2_upstream.parquet
        type: land_cover_bucketed
        scope: local
        join_keys: [mun_id, year]
        variables:
          - local_lc_forest
          - local_lc_nonforest_nat
          - local_lc_pasture
          - local_lc_agriculture
          - local_lc_farming_unclassified
          - local_lc_urban
          - local_lc_mining
          - local_lc_other
          - local_lc_water
          - local_lc_nat
          - local_alr_pasture
          - local_alr_agriculture
          - local_alr_farming_unclassified
          - local_alr_urban
          - local_alr_mining
          - local_alr_other
      - name: land_cover_adm2_upstream
        path: data/land_cover/processed/aggregate/land_cover_adm2_upstream.parquet
        type: land_cover_bucketed
        join_keys: [mun_id, year]
        kernel: inv_sqrt_distance
        variables:
          - lc_forest
          - lc_nonforest_nat
          - lc_pasture
          - lc_agriculture
          - lc_farming_unclassified
          - lc_urban
          - lc_mining
          - lc_other
          - lc_water
          - lc_nat
          - alr_pasture
          - alr_agriculture
          - alr_farming_unclassified
          - alr_urban
          - alr_mining
          - alr_other
      - name: climate_adm2_upstream_yearly
        path: data/climate/processed/aggregate/climate_adm2_upstream_yearly.parquet
        type: climate_bucketed
        join_keys: [adm2_id, year]
        id_map: {adm2_id: mun_id}
        kernel: inv_sqrt_distance
        # Raw ERA5-Land variable codes referenced by
        # src/data/sources/climate/schema.py's ANNUAL_* aggregation-rule sets; confirm
        # against the actual `climate_variable` values in
        # `climate_adm2_upstream_yearly.parquet` before relying on this list.
        variables:
          - "2t"
          - "2d"
          - tp
          - sro
          - ssro
          - pev
          - swvl1
          - swvl2
          - 2t_daily_min
          - 2t_daily_max
      # Local climate: the same ADM2-touching rings as local land cover -- the
      # municipality's own catchment, a direct confounder for health.
      - name: climate_adm2_local_yearly
        path: data/climate/processed/aggregate/climate_adm2_upstream_yearly.parquet
        type: climate_bucketed
        scope: local
        join_keys: [adm2_id, year]
        id_map: {adm2_id: mun_id}
        variables:
          - local_2t
          - local_2d
          - local_tp
          - local_sro
          - local_ssro
          - local_pev
          - local_swvl1
          - local_swvl2
          - local_2t_daily_min
          - local_2t_daily_max
      - name: population
        path: data/population/processed/population.parquet
        # population.parquet is long over sex/age_group (one row per
        # (mun_id, year, sex, age_group)); `grouped_sum` collapses those
        # strata into a single total-population value per (mun_id, year)
        # before the merge, which otherwise fails `validate="many_to_one"`.
        # The stratified breakdown remains available in population.parquet
        # itself for any future health metric (e.g. a fertility rate) that
        # needs a specific age/sex denominator.
        type: grouped_sum
        join_keys: [mun_id, year]
        variables:
          - population
      - name: biome_adm2
        path: data/biomes/processed/biomes_adm2.parquet
        join_keys: [mun_id]
        variables:
          - biome
        # A municipality's dominant biome is a fixed label by intersecting
        # area, not a measurement -- exclude it from numeric-dtype enforcement.
        categorical_variables: [biome]
      - name: otto_basins_adm2
        path: data/river_network/processed/river_network_adm2_otto_basins.parquet
        join_keys: [adm2]
        id_map: {adm2: mun_id}
        variables:
          - otto_basin_l2
          - otto_basin_l3
          - otto_basin_l4
          - otto_basin_l5
        # Dominant Otto Pfafstetter sub-basin per municipality, by summed
        # drainage area of its intersecting trenches (see
        # src.data.sources.river_network.otto_basins) -- the clustering unit,
        # as on the sensor side. String codes: exclude from numeric enforcement.
        categorical_variables: [otto_basin_l2, otto_basin_l3, otto_basin_l4, otto_basin_l5]
      # SIH hospitalizations by municipality of residence. The processed tables
      # are long over `metric_name` (and a category); SIH's `municipality_code`
      # is already the 6-digit `mun_id`, so it is renamed rather than id-mapped.
      # Legacy (<= 2007) and current (>= 2008) SIH series never overlap in a year.
      - name: hospitalizations
        path: data/health/processed/health_hospitalizations.parquet
        type: long_pivot
        join_keys: [municipality_code, year]
        rename: {municipality_code: mun_id}
        pivot_column: metric_name
        value_columns: [metric_value]
        column_template: "hosp_{pivot_value}"
        variables:
          - hosp_hospitalizations_count
          - hosp_in_hospital_deaths_count
          - hosp_inpatient_days_count
      - name: hospitalizations_icd10_chapter
        path: data/health/processed/health_hospitalizations_icd10_chapter.parquet
        type: long_pivot
        join_keys: [municipality_code, year]
        rename: {municipality_code: mun_id}
        filter: {metric_name: hospitalizations_count}
        pivot_column: icd10_chapter_code
        value_columns: [metric_value]
        column_template: "hosp_icd_{pivot_value}"
        variables:
          - hosp_icd_01
          - hosp_icd_02
          - hosp_icd_03
          - hosp_icd_04
          - hosp_icd_05
          - hosp_icd_06
          - hosp_icd_07
          - hosp_icd_08
          - hosp_icd_09
          - hosp_icd_10
          - hosp_icd_11
          - hosp_icd_12
          - hosp_icd_13
          - hosp_icd_14
          - hosp_icd_15
          - hosp_icd_16
          - hosp_icd_17
          - hosp_icd_18
          - hosp_icd_19
          - hosp_icd_20
          - hosp_icd_21
          - hosp_icd_99
      # Morbidity channels cover 1998-2024; legacy-2000 injuries list fewer
      # causes than other years.
      - name: hospitalizations_morbidity_channel
        path: data/health/processed/health_hospitalizations_selected_morbidity_list.parquet
        type: long_pivot
        join_keys: [municipality_code, year]
        rename: {municipality_code: mun_id}
        filter: {metric_name: hospitalizations_count}
        pivot_column: morbidity_channel
        value_columns: [metric_value]
        column_template: "hosp_{pivot_value}"
        variables:
          - hosp_cardiovascular_pollution_sensitive
          - hosp_congenital_anomalies
          - hosp_injuries_accidents_occupational
          - hosp_leptospirosis_water_exposure
          - hosp_mental_health_substance_use
          - hosp_perinatal_newborn
          - hosp_pregnancy_maternal
          - hosp_renal_urinary_toxic_water
          - hosp_respiratory_air_dust
          - hosp_skin_contact
          - hosp_symptoms_unspecific
          - hosp_toxic_poisoning
          - hosp_vector_borne_ecological
          - hosp_violence_self_harm
          - hosp_water_sanitation_gastrointestinal
      # SINASC births with low-birth-weight (< 2500 g) and preterm (< 37 weeks)
      # counts; `*_known` exclude "Ignorado" and are the share denominators.
      - name: births
        path: data/health/processed/health_births.parquet
        join_keys: [mun_id, year]
        variables:
          - births
          - births_weight_known
          - births_low_weight
          - births_gestation_known
          - births_preterm
      # SIM deaths by municipality of residence and age band. ICD-9 (<= 1995) and
      # ICD-10 (>= 1996) series never overlap in a year; a municipality-year SIM
      # does not list (mostly: municipality not yet created) stays missing.
      - name: mortality
        path: data/health/processed/health_mortality.parquet
        join_keys: [mun_id, year]
        variables:
          - deaths_total
          - deaths_under_1
          - deaths_1_to_4
          - deaths_5_to_9
          - deaths_10_to_14
          - deaths_15_to_19
          - deaths_20_to_29
          - deaths_30_to_39
          - deaths_40_to_49
          - deaths_50_to_59
          - deaths_60_to_69
          - deaths_70_to_79
          - deaths_80_and_more
          - deaths_age_unknown
      # MapBiomas Collection 11 mining substances (`land_cover --product
      # mining`): upstream group shares within 50 and 200 km (inv-sqrt kernel,
      # as the land-cover block) and the local, own-trench shares (the
      # negative buckets of the trenches touching the municipality, equally
      # weighted, as `local_lc_mining`). Shares of land area; missing where a
      # municipality has no rings in the reach. Covers 1985-2025.
      - name: c11_mining_adm2_upstream_50
        path: data/land_cover/processed/aggregate/land_cover_mining_adm2_upstream.parquet
        type: mining_bucketed
        join_keys: [mun_id, year]
        kernel: inv_sqrt_distance
        max_km: 50
        rename:
          mining_garimpo_gold: c11_garimpo_gold_50
          mining_garimpo_gold_active: c11_garimpo_gold_active_50
          mining_garimpo_unknown: c11_garimpo_unknown_50
          mining_garimpo_other: c11_garimpo_other_50
          mining_industrial_gold: c11_industrial_gold_50
          mining_industrial_other: c11_industrial_other_50
        variables:
          - c11_garimpo_gold_50
          - c11_garimpo_gold_active_50
          - c11_garimpo_unknown_50
          - c11_garimpo_other_50
          - c11_industrial_gold_50
          - c11_industrial_other_50
      - name: c11_mining_adm2_upstream_200
        path: data/land_cover/processed/aggregate/land_cover_mining_adm2_upstream.parquet
        type: mining_bucketed
        join_keys: [mun_id, year]
        kernel: inv_sqrt_distance
        max_km: 200
        rename:
          mining_garimpo_gold: c11_garimpo_gold_200
          mining_garimpo_gold_active: c11_garimpo_gold_active_200
          mining_garimpo_unknown: c11_garimpo_unknown_200
          mining_garimpo_other: c11_garimpo_other_200
          mining_industrial_gold: c11_industrial_gold_200
          mining_industrial_other: c11_industrial_other_200
        variables:
          - c11_garimpo_gold_200
          - c11_garimpo_gold_active_200
          - c11_garimpo_unknown_200
          - c11_garimpo_other_200
          - c11_industrial_gold_200
          - c11_industrial_other_200
      - name: c11_mining_adm2_local
        path: data/land_cover/processed/aggregate/land_cover_mining_adm2_upstream.parquet
        type: mining_bucketed
        scope: local
        join_keys: [mun_id, year]
        rename:
          local_mining_garimpo_gold: local_c11_garimpo_gold
          local_mining_garimpo_gold_active: local_c11_garimpo_gold_active
          local_mining_garimpo_unknown: local_c11_garimpo_unknown
          local_mining_garimpo_other: local_c11_garimpo_other
          local_mining_industrial_gold: local_c11_industrial_gold
          local_mining_industrial_other: local_c11_industrial_other
        variables:
          - local_c11_garimpo_gold
          - local_c11_garimpo_gold_active
          - local_c11_garimpo_unknown
          - local_c11_garimpo_other
          - local_c11_industrial_gold
          - local_c11_industrial_other
      # SGB gold geology per municipality (static): occurrence counts by
      # economic status, alluvial occurrences, and gold district/province shares.
      - name: geology_adm2
        path: data/geology/processed/geology_adm2.parquet
        join_keys: [mun_id]
        variables:
          - area_km2
          - gold_occurrences
          - gold_occurrences_unexploited
          - gold_occurrences_garimpo
          - gold_occurrences_mine
          - gold_occurrences_undetermined
          - gold_occurrences_alluvial
          - gold_district_share
          - gold_province_share
      # SIVEP-Malária positives by infection (`inf_`), residence (`res_`) and
      # notification (`noti_`) municipality. The table lists only
      # municipality-years with a record, so the rest of 2004-2024 is 0;
      # outside SIVEP's years the counts stay missing.
      - name: malaria_adm2
        path: data/malaria/processed/malaria_adm2.parquet
        join_keys: [mun_id, year]
        fill: {value: 0, years: [2004, 2024]}
        variables:
          - inf_cases
          - inf_garimpo
          - inf_garimpo_local
          - inf_garimpo_incoming
          - inf_garimpo_incoming_other_state
          - res_cases
          - res_garimpo
          - res_garimpo_elsewhere
          - res_garimpo_abroad
          - noti_exams
          - noti_positives
