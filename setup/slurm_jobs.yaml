# Slurm resource specs for `python -m src.cli data <verb> --source X --slurm`.
#
# Keyed by "<source>.<verb>" or "<source>.<verb>.<phase>", matching the
# SOURCE_REGISTRY / phase names in src/cli.py. Each entry is merged on top of
# `defaults`. To add Slurm support for a source/verb combo that isn't listed
# here yet, add a new key -- `--slurm` will otherwise fail with a clear error
# pointing back at this file.

defaults:
  partition: scicore
  conda_hook: /scicore/home/meiera/schulz0022/miniforge-pypy3/bin/conda
  conda_env: "311"
  project_dir: /scicore/home/meiera/schulz0022/projects/river-pollution-brazil

jobs:
  # Formerly setup/slurm_scripts/extract_climate.sh
  climate.preprocess.extract:
    job_name: extract_climate
    time: "0-12:00:00"
    qos: 1day
    cpus_per_task: 4
    mem: 128G
    extra_env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1

  # Formerly setup/slurm_scripts/assemble_climate.sh. Default --variant is
  # "all", running sensor and ADM2 upstream panels sequentially in one job;
  # pass --variant explicitly to submit just one. Time budget covers both.
  climate.preprocess.aggregate:
    job_name: aggregate_climate
    time: "1-00:00:00"
    qos: 1day
    cpus_per_task: 4
    mem: 128G

  # Formerly setup/slurm_scripts/extract_land_cover.sh
  land_cover.preprocess.extract:
    job_name: extract_land_cover
    time: "0-12:00:00"
    qos: 1day
    cpus_per_task: 4
    mem: 128G

  # Formerly setup/slurm_scripts/assemble_land_cover_adm2.sh and
  # assemble_land_cover_sensor.sh. Default --variant is "all", running the
  # sensor and ADM2 upstream panels sequentially in one job; pass --variant
  # explicitly to submit just one. Time budget covers both.
  land_cover.preprocess.aggregate:
    job_name: aggregate_land_cover
    time: "0-12:00:00"
    qos: 1day
    cpus_per_task: 4
    mem: 64G

  # `--product mining`: the Collection 11 mining-substances rasters (41 years,
  # 30 m, mostly zero). The extract reads every year's full raster per trench
  # batch and takes about 5 h on 4 cores; the ADM2 aggregate about 45 min.
  land_cover.preprocess.extract.mining:
    job_name: extract_land_cover_mining
    time: "0-12:00:00"
    qos: 1day
    cpus_per_task: 4
    mem: 128G

  land_cover.preprocess.aggregate.mining:
    job_name: aggregate_land_cover_mining
    time: "0-06:00:00"
    qos: 6hours
    cpus_per_task: 4
    mem: 64G

  # Formerly setup/slurm_scripts/assemble_sensor_data.sh. sensor_data has a
  # single preprocess step (cleaning + the GADM/river_network trench-join and
  # streamflow matching); the resource profile below covers the latter, the
  # heavy part.
  sensor_data.preprocess:
    job_name: preprocess_sensor_data
    time: "0-06:00:00"
    qos: 6hours
    cpus_per_task: 4
    mem: 128G

  # Biome polygon -> ADM2 / station roll-up. The heavy step is the
  # geopandas overlay of the 1:250000 IBGE biome polygons against every
  # ADM2 municipality in build_adm2_biomes(); single-threaded but
  # memory-hungry on the detailed geometries.
  biomes.preprocess:
    job_name: preprocess_biomes
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 4
    mem: 64G

  # SGB gold occurrences and province/district polygons -> ADM2. The overlay
  # of the dissolved province union against every municipality dominates.
  # (geology fetch needs internet: run it on the transfer node, not Slurm.)
  protected_areas.preprocess:
    job_name: preprocess_protected_areas
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 32G

  # `--product trenches`: drainage polygons of every trench (464k, ~1 GB) x the
  # Indigenous lands and barred units, intersected pair by pair.
  protected_areas.preprocess.trenches:
    job_name: preprocess_protected_areas_trenches
    time: "0-02:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 64G

  geology.preprocess:
    job_name: preprocess_geology
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 32G

  # `--product upstream`: SGB occurrences placed in river trenches and counted
  # upstream of each municipality. Loads the full river network (the system
  # matrices, ~9 GB) like the land-cover ADM2 aggregate.
  geology.preprocess.upstream:
    job_name: preprocess_geology_upstream
    time: "0-03:00:00"
    qos: 6hours
    cpus_per_task: 4
    mem: 96G

  # SIVEP-Malária 2004-2024 -> ADM2 case counts and garimpo flows. One year
  # (up to ~3.5M records, 12 columns) is in memory at a time.
  # (malaria fetch needs internet: run it on the transfer node, not Slurm.)
  malaria.preprocess:
    job_name: preprocess_malaria
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 32G

  # ANM SCM microdata: four tables of ~1M rows each read from the zip (the
  # 1.1 GB event table is not read). The archive is placed by hand.
  mining.preprocess:
    job_name: preprocess_mining
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 16G

  enforcement.preprocess:
    job_name: preprocess_enforcement
    time: "0-01:00:00"
    qos: 6hours
    cpus_per_task: 2
    mem: 32G

  # EOG VIIRS annual composites -> ADM2 x year. One worker per file, each
  # decompressing a global .tif.gz (11.6 GB) and holding the Brazil window
  # (~10,900 x 9,400 pixels, ~3 GB with its temporaries).
  nightlights.preprocess:
    job_name: preprocess_nightlights
    time: "0-03:00:00"
    qos: 6hours
    cpus_per_task: 8
    mem: 64G

  # Formerly setup/slurm_scripts/generate_river_network.sh
  river_network.preprocess:
    job_name: preprocess_river_network
    time: "0-00:30:00"
    qos: 30min
    cpus_per_task: 4
    mem: 64G

  # `python -m src.cli data assemble --dataset <sensor_panel|adm2_panel> --slurm`.
  # One key covers both dataset ids -- `src.data.assembly.build` just merges
  # already-aggregated per-station/per-ADM2 parquet files in pandas (no raw
  # hydrology/raster work), so this is comparatively light; conservative
  # defaults below, tune down once real run times/memory are observed.
  assemble:
    job_name: assemble
    time: "0-02:00:00"
    qos: 6hours
    cpus_per_task: 4
    mem: 64G
